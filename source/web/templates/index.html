<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PgnChecker Web Board</title>

    <!-- Lichess chessground (GPL) -->
    <link rel="stylesheet" href="https://unpkg.com/chessground@9.2.1/assets/chessground.base.css" />
    <link rel="stylesheet" href="https://unpkg.com/chessground@9.2.1/assets/chessground.brown.css" />
    <link rel="stylesheet" href="https://unpkg.com/chessground@9.2.1/assets/chessground.cburnett.css" />

    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="controls">
        <button id="flip">Flip</button>
        <button id="reset">Reset</button>
        <button id="srNew" title="Spaced repetition: new random position">New</button>
        <button id="srPrev" title="Spaced repetition: go back to the previous position">Previous</button>
        <button id="srHint" title="Spaced repetition: get a hint">Hint</button>
        <button id="srStudyFromHere" title="Spaced repetition: use the current review position as the study start">Study from here</button>
        <button id="srSearchMove" title="Spaced repetition: search occurrences of the last move">Search move</button>
        <a
          id="srAnalyzeLichess"
          class="button-link disabled"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          aria-disabled="true"
          tabindex="-1"
          title="Spaced repetition: analyze the current review position on Lichess"
        >Analyze on Lichess</a>
        <span id="status" class="status">disconnected</span>
      </div>
    </div>

    <div class="app">
      <div class="left">
        <div id="board" class="cg-wrap"></div>
        <div class="panel review-db-stats-panel" id="reviewDbStatsPanel" hidden>
          <div class="review-db-stats-panel-head">
            <div class="review-db-stats-title">Database stats</div>
            <div id="reviewDbStatsSummary" class="review-db-stats-summary"></div>
          </div>
          <div id="reviewDbStatsList" class="review-db-stats-list"></div>
        </div>
      </div>
      <div class="right">
        <div class="panel">
          <div class="row">
            <label for="fen">FEN</label>
            <input id="fen" type="text" spellcheck="false" />
            <button id="setFen">Set</button>
          </div>
          <div class="row">
            <label>Message</label>
            <div id="message" class="message"></div>
          </div>
        </div>

        <div class="panel tree-panel" id="treePanel">
          <div id="guessActions" class="guess-actions" hidden>
            <button id="srGuessGiveUp" type="button" title="Spaced repetition: reveal the line and browse variations">Give Up</button>
            <button id="srGuessFinish" type="button" title="Spaced repetition: reveal the line, browse variations, and mark that no further learning is needed">Finish Learning</button>
            <button id="srGuessBlacklist" type="button" title="Spaced repetition: reveal the line, browse variations, and blacklist the current move from future prompts">Don't Show This Move</button>
            <button id="srGuessTooEasy" type="button" title="Spaced repetition: reveal the line, browse variations, and mark this prompt as too easy">Line Too Easy</button>
          </div>
          <div id="variation-tree" class="variation-tree"></div>
        </div>

        <div class="panel logpanel">
          <div class="row rowhead">
            <div>Log</div>
            <button id="clearLog">Clear</button>
          </div>
          <pre id="log" class="log"></pre>
        </div>
      </div>
    </div>

    <div class="search-overlay" id="searchMoveOverlay" hidden>
      <div class="panel search-panel" id="searchMovePanel" role="dialog" aria-modal="true" aria-labelledby="searchMoveTitle">
        <div class="search-head">
          <div id="searchMoveTitle" class="search-title">Search move</div>
          <button id="searchMoveClose" type="button" class="search-close" aria-label="Close search results">Close</button>
        </div>
        <div id="searchMoveResults" class="search-results"></div>
      </div>
    </div>

    <script type="module" src="/static/board.js"></script>
  </body>
</html>
